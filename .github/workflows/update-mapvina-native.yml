name: Update mapvina-native dependency

on:
  schedule:
    # The first day of every month at 12:00 AM UTC
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with: { persist-credentials: false }
      - name: Install just
        uses: taiki-e/install-action@4bc351f7f2614e48088386e2a0ad917ca3a7e4ba # v2.81.5
        with:
          tool: just

      - name: Update mapvina-native
        run: just update-mapvina-native

      - name: Get mapvina-native details
        id: mapvina-details
        run: |
          echo "details<<EOF" >> $GITHUB_OUTPUT
          just show-mapvina-native
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update `mapvina-native`"
          title: "chore(deps): update `mapvina-native`"
          body: |
            ## Automated `mapvina-native` dependency update

            This PR updates `package.metadata.mln.release` in `Cargo.toml` to the latest Mapvina Native Core release.

            ${{ steps.mapvina-details.outputs.details }}
          branch: update-mapvina-native-dependency
          delete-branch: true
          labels: dependencies
